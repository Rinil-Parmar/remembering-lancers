services:
  web:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      FLASK_APP: app.py
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your Docker env file or deployment secret store}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your Docker env file or deployment secret store}
      SCRAPER_MAX_PAGES: ${SCRAPER_MAX_PAGES:-1}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "flask db upgrade && python wsgi.py"

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in your Docker env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your Docker env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your Docker env file or deployment secret store}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
