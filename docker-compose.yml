services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      FLASK_APP: app.py
      SECRET_KEY: change-this-secret-before-deploy
      DATABASE_URL: postgresql://postgres:postgres@db:5432/remembering_lancers
      SCRAPER_MAX_PAGES: 1
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "flask db upgrade && python wsgi.py"

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: remembering_lancers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d remembering_lancers"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
